name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          # Dependabot はこの値を更新しないため、uv を上げるときは手動で揃える
          version: "0.13.5"
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Bandit
        run: uv run bandit -r ja_sentence_segmenter/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          # Dependabot はこの値を更新しないため、uv を上げるときは手動で揃える
          version: "0.13.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run tests via tox
        run: uv run --locked tox run -e py
